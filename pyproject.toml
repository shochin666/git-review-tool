[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "git-review-tool"
version = "1.0.0"
description = "Automated PR review and commit message generator"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["git", "pr", "review", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "click>=8.0.0",
    "requests>=2.25.0",
    "rich>=10.0.0",  # 美しいCLI出力用
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
]

[project.scripts]
git-review = "git_review.cli:main"  # エントリーポイント登録

[project.urls]
Homepage = "https://github.com/yourusername/git-review-tool"
Repository = "https://github.com/yourusername/git-review-tool"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
git_review = ["*.yaml", "*.json"]